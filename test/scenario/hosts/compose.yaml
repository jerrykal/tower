# The simulated hosts of the scenario suite (TOWER_HOSTS=container): a
# pool of TT_HOSTS containers the harness assigns to worlds and resets
# between them. The harness brings the project up and down; every
# container, network and image carries the label tower-test and a tt-
# name (tt-<run>-host-<n>).
name: tt-${TT_RUN}

services:
  host:
    # Built by the harness (docker build): compose would stamp each run's
    # project into the image and leave the last one dangling.
    image: tt-scenario-host:latest
    pull_policy: never
    labels: [tower-test]
    deploy:
      replicas: ${TT_HOSTS:-6}
    # NET_ADMIN: the agent's shaping and faults. SYS_PTRACE: it reads
    # which sshd port a session's processes came in on (their
    # environment, ss -p), across users; within the container's own pids.
    cap_add: [NET_ADMIN, SYS_PTRACE]
    # Each host has pids of its own, as a machine does; tini as pid 1
    # reaps what daemons leave.
    init: true
    networks: [hosts]
    environment:
      TT_PUBKEY: ${TT_PUBKEY}
      TT_AGENT: ${TOWER_TEST_DIR}/bin/hostagent
      TT_SLOTS: ${TOWER_TEST_DIR}/slots
    volumes:
      - ${TOWER_TEST_DIR}:${TOWER_TEST_DIR}
      - ${TMUX_TMPDIR}:${TMUX_TMPDIR}
      - ${TMPDIR}:${TMPDIR}

networks:
  hosts:
    name: tt-${TT_RUN}-net
    labels: [tower-test]
