# Two simulated hosts for the scenario suite (TOWER_HOSTS=container).
# The harness brings the project up and down; every container, network
# and image carries the label tower-test and a tt- name.
name: tt-${TT_RUN}

x-host: &host
  # Built by the harness (docker build): compose would stamp each run's
  # project into the image and leave the last one dangling.
  image: tt-scenario-host:latest
  pull_policy: never
  labels: [tower-test]
  cap_add: [NET_ADMIN]
  # The suite finds, signals and sweeps a host's processes by pid.
  pid: host
  networks: [hosts]
  volumes:
    - ${TOWER_TEST_DIR}:${TOWER_TEST_DIR}
    - ${TMUX_TMPDIR}:${TMUX_TMPDIR}
    - ${TMPDIR}:${TMPDIR}

services:
  h1:
    <<: *host
    container_name: tt-${TT_RUN}-h1
    environment:
      TT_PUBKEY: ${TT_PUBKEY}
      TT_ENV: ${TOWER_TEST_DIR}/slots/h1.env
  h2:
    <<: *host
    container_name: tt-${TT_RUN}-h2
    environment:
      TT_PUBKEY: ${TT_PUBKEY}
      TT_ENV: ${TOWER_TEST_DIR}/slots/h2.env

networks:
  hosts:
    name: tt-${TT_RUN}-net
    labels: [tower-test]
