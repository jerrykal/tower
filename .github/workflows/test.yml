name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: tmux
        run: |
          if command -v apt-get >/dev/null; then sudo apt-get update -q && sudo apt-get install -yq tmux; else brew install tmux; fi
          tmux -V
      - run: mise run test
